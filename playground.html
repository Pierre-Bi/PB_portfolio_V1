<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelier — Pierre Bitsch</title>
    <link rel="canonical" href="https://pierrebitsch.com/playground.html">
    <meta name="description" content="Atelier expérimental — créez des sphères 3D génératives avec vos propres couleurs. Peignez, ajustez le grain et exportez.">

    <!-- Styles globaux du site + styles dédiés au playground -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="playground.css">

    <link rel="icon" href="assets/Logo_PB_color.svg" type="image/svg+xml">
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap" rel="stylesheet">

    <!-- Dépendances -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
    <!-- Three.js retiré : sphère en WebGL pur, aucune dépendance CDN -->
</head>
<body class="atelier-body">

    <!-- ── NAVIGATION (cohérente avec le reste du site) ── -->
    <nav class="dock-menu">
        <a href="index.html" class="logo-btn" title="Retour Accueil">
            <i class="ph-bold ph-arrow-left back-arrow-icon"></i>
        </a>
        <div class="dock-center-group">
            <ul class="dock-links">
                <li><a href="apropos.html"    class="dock-item" title="À Propos"><i class="ph ph-user"></i></a></li>
                <li><a href="archive.html"    class="dock-item" title="Archive"><i class="ph ph-folder-open"></i></a></li>
                <li><a href="playground.html" class="dock-item active" title="Atelier"><i class="ph ph-magic-wand"></i></a></li>
                <li><a href="contact.html"    class="dock-item" title="Contact"><i class="ph ph-envelope-simple"></i></a></li>
            </ul>
            <div class="dock-separator"></div>
            <button class="dock-item theme-toggle" id="theme-toggle-btn"><i class="ph ph-moon"></i></button>
        </div>
        <div class="dock-bottom"><div class="clock-vertical" id="clock">00:00</div></div>
    </nav>

    <!-- ── HEADER flottant ── -->
    <header class="atelier-header">
        <span class="atelier-title">ATELIER</span>
        <div class="atelier-sep"></div>
        <span class="atelier-hint">Peignez des couleurs → la sphère les absorbe</span>
    </header>

    <!-- ── CONTENU PRINCIPAL : split screen ── -->
    <div class="atelier-wrapper">

        <!-- GAUCHE : Palette de dessin -->
        <div class="draw-panel">
            <p class="panel-label">Palette</p>

            <canvas id="draw-canvas"></canvas>

            <!-- Contrôles de dessin -->
            <div class="draw-controls">

                <!-- Swatches rapides -->
                <div class="preset-colors">
                    <button class="preset-swatch active" data-color="#f95319" style="background:#f95319;" title="Orange"></button>
                    <button class="preset-swatch"        data-color="#ff669d" style="background:#ff669d;" title="Rose"></button>
                    <button class="preset-swatch"        data-color="#7dd3fc" style="background:#7dd3fc;" title="Ciel"></button>
                    <button class="preset-swatch"        data-color="#86efac" style="background:#86efac;" title="Vert"></button>
                    <button class="preset-swatch"        data-color="#fbbf24" style="background:#fbbf24;" title="Or"></button>
                    <button class="preset-swatch"        data-color="#c084fc" style="background:#c084fc;" title="Violet"></button>
                    <button class="preset-swatch"        data-color="#fffaf5" style="background:#fffaf5;" title="Blanc"></button>
                    <!-- Color picker custom -->
                    <div class="color-picker-wrap" title="Couleur personnalisée">
                        <input type="color" id="brush-color" value="#f95319">
                        <i class="ph ph-plus"></i>
                    </div>
                </div>

                <!-- Couleurs actives dans la sphère (avec suppression individuelle) -->
                <div class="palette-row">
                    <span class="ctrl-section-label">Sphère</span>
                    <div class="palette-preview" id="palette-dots"></div>
                </div>

                <!-- Effacer le canvas -->
                <button class="btn-clear" id="clear-draw">Effacer</button>
            </div>
        </div>

        <!-- DROITE : Sphère 3D générative -->
        <div class="sphere-panel">
            <canvas id="sphere-canvas" width="380" height="380" style="width:380px;height:380px;"></canvas>
        </div>

    </div>

    <!-- ── BARRE DE CONTRÔLES flottante ── -->
    <div class="controls-bar">

        <div class="control-group">
            <span class="ctrl-label">Turbulence</span>
            <input type="range" class="ctrl-slider" id="turb-slider" min="0" max="100" value="38">
        </div>

        <div class="ctrl-sep"></div>

        <div class="control-group">
            <span class="ctrl-label">Douceur</span>
            <input type="range" class="ctrl-slider" id="douceur-slider" min="0" max="100" value="40">
        </div>

        <div class="ctrl-sep"></div>

        <div class="control-group">
            <span class="ctrl-label">Vitesse</span>
            <input type="range" class="ctrl-slider" id="speed-slider" min="0" max="100" value="40">
        </div>

        <div class="ctrl-sep"></div>

        <button class="btn-export" id="export-btn">
            <i class="ph ph-export"></i> Exporter
        </button>

    </div>

    <!-- ── Scripts ── -->
    <!-- script.js gère l'horloge et le thème, présents sur toutes les pages -->
    <script src="script.js" defer></script>
    <!-- playground.js : logique exclusive à cette page -->
    <script src="playground.js" defer></script>

</body>
</html>
